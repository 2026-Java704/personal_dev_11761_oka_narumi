<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ログイン</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body>
	<header>
		<h1>ログイン</h1>
	</header>
	<main>
		<form action="/login" method="post">
			<div th:each="error:${errorList}">
				<span th:text="${error}" style="color: red"></span>
				<br>
			</div>
			<input type="text" name="email" placeholder="メールアドレス" th:value="${email}"><br>
			<input type="password" name="password" placeholder="パスワード"><br>
			<button>ログイン</button>
			<br> <span th:text="${message}" style="color: red"></span>
		</form>
		<br>
		<a href="/users/new">ユーザー新規登録</a>
	</main>
</body>

</html>
