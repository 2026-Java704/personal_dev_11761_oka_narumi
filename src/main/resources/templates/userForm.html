<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規登録</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body>
	<h1>新規登録</h1>

	<form action="/users/add" method="post">
		<div th:each="error:${errorList}">
			<span th:text="${error}" style="color: red"></span>
			<br>
		</div>
		<table border="1">
			<tr>
				<th>名前</th>
				<td>
					<input type="text" name="name" placeholder="名前" th:value="${name}">
				</td>
			</tr>
			<tr>
				<th>メールアドレス</th>
				<td>
					<input type="text" name="email" placeholder="メールアドレス" th:value="${email}">
				</td>
			</tr>
			<tr>
				<th>パスワード</th>
				<td>
					<input type="password" name="password" placeholder="パスワード">
				</td>
			</tr>
		</table>
		<button>新規作成</button>
	</form>
</body>

</html>
