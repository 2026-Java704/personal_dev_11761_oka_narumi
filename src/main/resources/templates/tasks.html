<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ToDoアプリ</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
	<link rel="icon" href="/icons/checkIcon.png">
</head>

<body>
	<header th:replace="~{header}"></header>

	<form class="form" action="/tasks" method="get">
		<div class="input-span">
		<input type="text" name="keyword" placeholder="タイトル名" th:value="${keyword}">
		</div>
		<div>
		<button class="btn-search">検索</button>
		</div>
	</form>
<!--	<div>-->
<!--	<a href="/tasks?sort=closingDateAsc" >-->
<!--		<button class="btn-new" type="button">日付順</button>-->
<!--	</a>-->
<!--	</div>-->
	
	<div class="btn-container">
	<a href="/tasks"><button class="btn-new" type="button">全タスク</a>
	</div>
	<a th:each="c:${categories}" th:href="'/tasks?categoryId='+${c.id}">
		<span th:text="${c.name}" style="padding-left: 10px;"></span>
	
	</a>
	<table border="1">
		<tr>
			<th>NO</th>
			<th>タイトル</th>
			<th>カテゴリー</th>
			<th>期限</th>
			<th>進捗状況</th>
			<th>重要度</th>
			<th>メモ</th>
			<th>変更</th>
			<th>削除</th>
		</tr>
		<tr th:each="task:${tasks}">
			<td th:text="${task.id}"></td>
			<td th:text="${task.title}"></td>
			<td th:text="${task.category.name}"></td>
			<td th:text="${task.closingDate}"></td>
			<td>
				<span th:if="${task.progress==0}">未着手</span>
				<span th:if="${task.progress==1}">進行中</span>
				<span th:if="${task.progress==2}">完了</span>
			</td>	
			<td>
				<span class="importance-1" th:if="${task.importance==0}">高</span>
				<span class="importance-2" th:if="${task.importance==1}">中</span>
				<span class="importance-3" th:if="${task.importance==2}">低</span>
			</td>
			<td th:text="${task.memo}"></td>
			<td>
				<form th:action="@{/tasks/{taskId}/edit(taskId=${task.id})}" method="get">
					<div class="btn-container">
					<button class="btn-edit-delete">更新</button>
					</div>
				</form>
			</td>
			<td>
				<form th:action="@{/tasks/{taskId}/delete(taskId=${task.id})}" method="post">
					<div class="btn-container">
					<button class="btn-edit-delete" type="submit" onclick="return confirm('本当に削除しますか？');">削除</button>
					</div>
				</form>
			</td>
		</tr>
	</table>
	<br>
	<div class="btn-container">
	<a href="/tasks/new"><button class="btn-new" type="button">taskを追加</button></a>
	</div>
	<div class="btn-container">
	<a href="/categories/add"><button class="btn-new" type="button">カテゴリを追加</button></a>
	</div>
	<footer th:replace="~{footer}"></footer>
</body>

</html>
