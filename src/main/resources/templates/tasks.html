<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ToDoアプリ</title>
	<link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body>
	<header th:replace="~{header}"></header>

	<form action="/tasks" method="get">
		タイトル<input type="text" name="keyword" th:value="${keyword}">
		<button>検索</button>
	</form>

	<a href="/tasks">全タスク</a>
	<a th:each="c:${categories}" th:href="'/tasks?categoryId='+${c.id}">
		<span th:text="${c.name}" style="padding-left: 10px;"></span>
	</a>
	<table border="1">
		<tr>
			<th>NO</th>
			<th>タイトル</th>
			<th>カテゴリー</th>
			<th>期限</th>
			<th>進捗状況</th>
			<th>重要度</th>
			<th>メモ</th>
			<th>変更</th>
			<th>削除</th>
		</tr>
		<tr th:each="task:${tasks}">
			<td th:text="${task.id}"></td>
			<td th:text="${task.title}"></td>
			<td th:text="${task.category.name}"></td>
			<td th:text="${task.closingDate}"></td>
			<td>
				<span th:if="${task.progress==0}">未着手</span>
				<span th:if="${task.progress==1}">進行中</span>
				<span th:if="${task.progress==2}">完了</span>
			</td>	
			<td>
				<span th:if="${task.importance==0}">高</span>
				<span th:if="${task.importance==1}">中</span>
				<span th:if="${task.importance==2}">低</span>
			</td>
			<td th:text="${task.memo}"></td>
			<td>
				<form th:action="@{/tasks/{taskId}/edit(taskId=${task.id})}" method="get">
					<button>更新</button>
				</form>
			</td>
			<td>
				<form th:action="@{/tasks/{taskId}/delete(taskId=${task.id})}" method="post">
					<button type="submit" onclick="return confirm('本当に削除しますか？');">削除</button>
				</form>
			</td>
		</tr>
	</table>
	<br>
	<a href="/tasks/new">タスク新規作成</a><br>
	<a href="/categories/add">カテゴリー新規作成</a>

</body>

</html>
